# Scene env of the project: the observation shown (and recorded) while no policy is loaded,
# in the policy client's format (mappings), plus the 3D scene description.
frequency: 30.0

mappings:
  "observation.state":
    - topic: /franka_right/franka/joint_states
      msgtype: sensor_msgs/msg/JointState
      fields: [position]
      n_dof: 7
    - topic: /franka_right/franka_gripper/joint_states
      msgtype: sensor_msgs/msg/JointState
      fields: [position]
      n_dof: 1
    - topic: /franka_left/franka/joint_states
      msgtype: sensor_msgs/msg/JointState
      fields: [position]
      n_dof: 7
    - topic: /franka_left/franka_gripper/joint_states
      msgtype: sensor_msgs/msg/JointState
      fields: [position]
      n_dof: 1
  "observation.images.zed_middle":
    topic: /zed_rig/synced_raw_snapshot
    msgtype: franka_custom_msgs/msg/RigSnapshot
    camera_name: zed_middle
    center_crop: true
    resize: [224, 224]
    encoding: rgb8
  "observation.images.zed_right_arm":
    topic: /zed_rig/synced_raw_snapshot
    msgtype: franka_custom_msgs/msg/RigSnapshot
    camera_name: zed_right_arm
    center_crop: true
    resize: [224, 224]
    encoding: rgb8
  "observation.images.zed_left_arm":
    topic: /zed_rig/synced_raw_snapshot
    msgtype: franka_custom_msgs/msg/RigSnapshot
    camera_name: zed_left_arm
    center_crop: true
    resize: [224, 224]
    encoding: rgb8
  # Merged Fast-FoundationStereo cloud of all rig cameras (world frame, computed on the Jetson),
  # sampled to a fixed size: voxel = even coverage, random = fastest, fps = farthest point (slow).
  "observation.pointcloud":
    topic: /ffs/points
    msgtype: sensor_msgs/msg/PointCloud2
    num_points: 4096
    fields: xyzrgb            # (4096, 6): x y z in m, r g b in 0..1
    sampling: voxel
    crop: {min: [0.0, -0.9, -0.02], max: [1.1, 0.9, 0.7]}   # table workspace, world frame

# Observation space: the modalities of this project. The studio's "Observation space" card
# switches them; an off modality drops its mappings, its scene clouds and its recorded topics,
# and `component` is started / stopped with it. RGB videos and the state are always recorded by
# the data collector (its own config); `record` adds topics to the episode's bag.
modalities:
  state:
    label: Robot state
    keys: [observation.state]
    required: true
  rgb:
    label: RGB cameras
    keys: ["observation.images.*"]
    required: true
    description: zed_middle, zed_right_arm, zed_left_arm · 224×224
  pointcloud:
    label: Point cloud
    keys: [observation.pointcloud]
    point_clouds: [merged]
    record: [/ffs/points]
    component: pointcloud
    default: false
    description: Fast-FoundationStereo on the Jetson, all cameras merged

# Home (studio Home): per arm the joint-space home of its teleop config (home_joints in
# franka_meta_quest/config/teleop_<side>.yaml, see franka_client/joint_home.py); ``home_joints``
# here would override it. Grippers open.
home_pose:
  - ns: franka_right
    gripper_topic: /franka_right/gripper/gripper_controller/joint_trajectory
    gripper_joint_name: franka_right_rh_r1
    gripper_open_val: 0.0
  - ns: franka_left
    gripper_topic: /franka_left/gripper/gripper_controller/joint_trajectory
    gripper_joint_name: franka_left_rh_r1
    gripper_open_val: 0.0

scene:
  robots:
    - name: franka_right
      description_topic: /franka_right/robot_description
      joint_states: [/franka_right/joint_states]
    - name: franka_left
      description_topic: /franka_left/robot_description
      joint_states: [/franka_left/joint_states]
  frames: [franka_right_grasp_point, franka_left_grasp_point]
  poses:
    - name: right target
      topic: /franka_right/fijk_debug
      msgtype: franka_custom_msgs/msg/FIJKDebug
      field: target_pose
      color: [244, 114, 182]
    - name: left target
      topic: /franka_left/fijk_debug
      msgtype: franka_custom_msgs/msg/FIJKDebug
      field: target_pose
      color: [167, 139, 250]
  # The full merged cloud (already in the world frame); the policy's sampled one is drawn too.
  point_clouds:
    - name: merged
      topic: /ffs/points
      max_points: 60000
  # Every camera of the ZED rig (config/cameras.yaml) is shown in the viewer and on the page.
  rig: {topic: /zed_rig/synced_raw_snapshot}
  # Plain sensor_msgs/Image cameras outside the rig: name -> topic
  camera_topics: {}
  # Where each camera is (by rig camera name or observation key): a URDF link (optical frame,
  # z forward) of one robot, or a fixed world pose. FOV comes from camera_info. The same poses go
  # to the point cloud node (a link is a TF frame there). Static cameras are placed / aligned in
  # the viewer (Camera placement) and saved to camera_poses.yaml.
  cameras:
    zed_right_arm: {robot: franka_right, link: franka_right_zed_left_camera_optical_frame}
    zed_left_arm: {robot: franka_left, link: franka_left_zed_left_camera_optical_frame}
  #  zed_middle: {position: [x, y, z], wxyz: [w, x, y, z]}   # or via camera_poses.yaml
