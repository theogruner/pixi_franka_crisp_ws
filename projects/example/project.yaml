# A Franka Studio project. Copy this folder to start a new one (projects/<name>/).
name: Example (bimanual)
description: Bimanual FR3 with the ZED rig — template project.

# Datasets live in <data_root>/<dataset>/<task>/episode_<ts>/ ({project} = folder name).
# Put it on the same disk as the data collector's storage_path so saving is a rename.
data_root: ~/data/{project}

# Scene env shown while no policy is loaded (what gets recorded). Policies without a `scene`
# section inherit the one from this file.
env: env.yaml

# Task folders offered in the data collection widget, with their default instruction.
tasks:
  place-cup: Pick up the cup and place it under the coffee machine.
  coffee-insert-capsule: Pick up a coffee capsule and insert it into the coffee machine.
  capsule-perforation: Close the lever of the coffee machine to perforate the capsule.

cluster:
  host: hessian
  remote_raw_root: /mnt/vast/workspaces/VLA_Reinforcement/custom_datasets/{project}/raw
  remote_dataset_root: /mnt/vast/workspaces/VLA_Reinforcement/custom_datasets/{project}/lerobot
  remote_config_dir: /mnt/vast/workspaces/VLA_Reinforcement/custom_datasets/{project}/studio_configs
  # Used when no file from conversion/ is chosen in the UI.
  default_convert_config: /mnt/vast/workspaces/VLA_Reinforcement/ken/data_postprocessing/configs/lerobot_bimanual_absolute.yaml
  # Runs over ssh after the rsync. Adjust the sbatch options and the python environment.
  # convert_batched.py resumes, so re-running after new demos only appends them; the quantile
  # fix must run after every conversion (see data_postprocessing/README.md).
  convert_cmd: >-
    cd /mnt/vast/workspaces/VLA_Reinforcement/ken/data_postprocessing && mkdir -p logs &&
    sbatch --job-name=convert_{dataset}_{task} --output=logs/convert_%j.log
    --time=08:00:00 --cpus-per-task=8 --mem=64G
    --wrap "source ~/.bashrc &&
    python scripts/convert_batched.py --raw-dir '{remote_raw_dir}' --config '{config}' --root '{remote_dataset_dir}' &&
    python scripts/conversion/fix_global_quantile_stats.py '{remote_dataset_dir}'"
  # Training: to be defined. {config} is the uploaded file from train_configs/.
  # train_cmd: "cd /path/to/training && sbatch train.sbatch '{config}' '{remote_dataset_dir}'"

# Project-specific components, merged over config/studio.yaml (e.g. a local policy server).
components: {}
