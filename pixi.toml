[workspace]
preview = ["pixi-build"]
authors = [
    "Maximilian Tölle <maximilian.toelle@dfki.de>",
    "Theo Gruner <theo.gruner@tu-darmstadt.de>",
    "Ken-Joel Simmoteit <ken-joel.simmoteit@tu-darmstadt.de>",
    "João Carvalho < joao@robot-learning.de>",
]
channels = ["https://fast.prefix.dev/conda-forge"]
name = "pixi_franka_crisp_ws"
platforms = ["linux-64"]

[activation]
scripts = ["scripts/set_ros_env.sh"]

[dependencies]
python = "*"
compilers = "*"
cmake = "*"
pkg-config = "*"
make = "*"
ninja = "*"
# Pin below 4: pinocchio 4.0.0 reorganised its headers (e.g. pinocchio/spatial/se3.hpp moved
# under pinocchio/deprecated/), which breaks crisp_controllers and franka_control_module.
# Drop the pin once the sources are ported.
pinocchio = ">=3,<4"
pure-python-adb = ">=0.3.0.dev0,<0.4"
pyqtgraph = ">=0.13.7,<0.14"
libtmux = ">=0.46.2,<0.47"
omegaconf = "*"
git = "*"
openssh = "*"

[tasks]
test_raw = "pytest --cov-report=html"
test = [{task="test_raw", environment="humble"}]
setup = "bash scripts/setup.sh"
profiles = "python3 scripts/python/workspace.py profiles"
update-src = "git submodule update --remote --merge"
build = "colcon build --symlink-install --packages-skip franka_mobile --cmake-args -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF"
clean = "rm -rf build install log"
clean-build = [{ task = "clean" }, { task = "build" }]
robot = "bash scripts/run_robot.sh"
teleop = "bash scripts/run_teleop.sh"
cameras = "bash scripts/run_cameras.sh"
pointcloud = "bash scripts/run_pointcloud.sh"
calibrate-board = "python scripts/python/board_calibration.py"   # ArUco board: wrist mounts, left base, static cameras
client = "bash scripts/run_client.sh"
data-collection = "bash scripts/run_data_collection.sh"
launch = { depends-on = ["robot", "teleop", "data-collection", "client"] }
studio_raw = { cmd = "python -m franka_studio", cwd = "studio" }
studio = [{ task = "studio_raw", environment = "humble" }]
studio-debug_raw = { cmd = "python -m franka_studio --debug", cwd = "studio" }
studio-debug = [{ task = "studio-debug_raw", environment = "humble" }]
# ROS's launch_testing pytest plugin does not load with this pytest, hence no plugin autoload
studio-test_raw = { cmd = "pytest studio/tests -q -p no:cacheprovider", env = { PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1" } }
studio-test = [{ task = "studio-test_raw", environment = "humble" }]


[target.linux.dependencies]
libgl-devel = "*"
libcap = "*"
poco = "*"

[environments]
humble = { features = ["humble", "franka", "extra", "dev"] }
jazzy = { features = ["jazzy", "franka", "extra", "dev"] }
humble-viser = { features = ["jazzy", "viser", "franka", "extra", "dev"] }
jazzy-viser = { features = ["jazzy", "viser", "franka", "extra", "dev"] }
humble-clean = { features = ["humble"] }

# humble
[feature.humble]
channels = ["https://prefix.dev/robostack-humble"]

[feature.humble.dependencies]
ros-humble-desktop = "*"
colcon-common-extensions = "*"
ros-humble-ros2-control = "*"
ros-humble-ros2-controllers = "*"
ros-humble-joint-state-publisher = "*"
ros-humble-rmw-zenoh-cpp = "*"
ros-humble-rmw-cyclonedds-cpp = "*"
ros-humble-rosbag2-storage-mcap = "*"
rosdep = "*"
libstdcxx-ng = "*"
setuptools = ">=65.0.0,<70.0.0"
ros-humble-moveit = "*"
ros-humble-plotjuggler-ros = ">=2.1.0,<3"

[feature.humble.pypi-dependencies]
viser = ">=1.0.16, <2"

# jazzy
[feature.jazzy]
channels = ["https://prefix.dev/robostack-jazzy"]

[feature.jazzy.dependencies]
ros-jazzy-desktop = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
ros-jazzy-joint-state-publisher = "*"
colcon-common-extensions = "*"
ros-jazzy-rmw-zenoh-cpp = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"
ros-jazzy-rosbag2-storage-mcap = "*"
rosdep = "*"
ros-jazzy-moveit = "*"
# scipy = "*"

[feature.viser.pypi-dependencies]
viser = ">=1.0.19, <2"
robot-descriptions = ">=1.22.0, <2"

[feature.dev.pypi-dependencies]
ruff= "*"
bumpver = "*"
build = "*"
twine = "*"
pre-commit = "*"
pytest = "*"  # for testing

[feature.franka.pypi-dependencies]
crisp-python = { git = "https://github.com/DFKI-SAIROL/crisp_py.git" }

[feature.franka.dependencies]
pynput = ">=1.8.1,<2"
grpcio = ">=1.67.1,<2"
pyzmq = ">=27.0.0,<28"
pyserial = ">=3.5,<4"
transforms3d = ">=0.4.2,<0.5"

[feature.extra.dependencies]
numpy = "<=2.3"

[feature.extra.pypi-dependencies]
rich = "*"  # For nice prints
matplotlib = "*"  # to do some plots

[pypi-dependencies]
yourdfpy = ">=0.0.58, <0.0.59"
